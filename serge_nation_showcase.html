<style>
:root {
    --bg: #000; --card: #111; --accent: #bb86fc;
    --text: #e0e0e0; --muted: #888; --border: #333;
    --green: #4ade80; --yellow: #fbbf24; --orange: #fb923c;
}
*, *::before, *::after { box-sizing: border-box; }
body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6; margin: 0; padding: 0;
}
.container { max-width: 1350px; margin: 0 auto; padding: 28px; }
h1 { color: #fff; font-size: 1.9rem; border-bottom: 2px solid var(--accent); padding-bottom: .6rem; margin-bottom: .4rem; }
h2 { color: var(--accent); font-size: 1.2rem; margin: 2rem 0 .4rem; }
h3 { color: #ccc; font-size: .95rem; margin: 1rem 0 .25rem; }
p  { margin: .4rem 0; }
strong { color: #fff; }
blockquote {
    border-left: 4px solid var(--accent); margin: .8rem 0;
    padding: .5rem 1rem; background: #0c0c1e;
    border-radius: 0 4px 4px 0; color: var(--muted);
}
hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
code {
    background: #1a1a2e; color: var(--accent);
    padding: 2px 6px; border-radius: 3px; font-size: .88em;
}
pre {
    background: #0a0a0a; border: 1px solid var(--border);
    border-radius: 6px; padding: 1rem; overflow-x: auto;
}
pre code { background: none; color: var(--green); padding: 0; font-size: .82rem; }

/* ── Outer match tables ───────────────────────────────── */
table {
    width: 100%; border-collapse: collapse;
    font-size: .88rem; margin: .8rem 0;
}
thead tr { border-bottom: 2px solid var(--accent); }
th {
    padding: .45rem .65rem; text-align: left;
    color: var(--muted); font-size: .7rem; text-transform: uppercase; font-weight: 700;
}
td { padding: .5rem .65rem; border-bottom: 1px solid #1e1e1e; vertical-align: top; }

/* Fixed column widths for # / Score / Company / Type / Rationale */
table.match-table td:nth-child(1) { width: 38px;  text-align: center; }
table.match-table td:nth-child(2) { width: 100px; }
table.match-table td:nth-child(3) { width: 230px; }
table.match-table td:nth-child(4) { width: 80px;  }
table.match-table td:nth-child(5) { /* rationale — remainder */ }

/* ── <details> / <summary> ───────────────────────────── */
details { margin: 0; }
summary {
    cursor: pointer; color: var(--accent);
    font-size: .82rem; user-select: none;
    list-style: none; display: inline-flex; align-items: center; gap: 4px;
}
summary::-webkit-details-marker { display: none; }
details[open] > summary { color: #d1a3ff; }

/* ── Rationale body ──────────────────────────────────── */
.rat {
    margin-top: .6rem; padding: .9rem 1.1rem;
    background: #06061a; border: 1px solid #252545;
    border-left: 4px solid var(--accent);
    border-radius: 0 6px 6px 0; font-size: .87rem;
}
/* Verdict banner (passed through as inline style div) */
.rat > div[style] { border-radius: 4px !important; margin-bottom: .7rem; }

/* Evidence section labels */
.rat > b, .rat b { color: var(--accent); }

/* Score breakdown table inside .rat */
.rat table {
    font-size: .8rem; margin: .5rem 0; width: 100%;
}
.rat table th { font-size: .68rem; }
.rat table td { padding: 4px 6px; }

/* Formula / code block inside .rat */
.rat pre {
    background: #000; color: var(--green);
    font-size: .78rem; padding: .6rem .8rem;
    border: 1px solid #1a1a1a;
}
</style>
</head>

const renderer = {
    table(header, body) {
        // Detect match table by looking for "Rationale" column header
        const isMatch = /rationale/i.test(header);
        const cls = isMatch ? ' class="match-table"' : '';
        return '<table' + cls + '><thead>' + header + '</thead><tbody>' + body + '</tbody></table>';
    },
    tablecell(content, flags) {
        const tag = flags.header ? 'th' : 'td';
        // Wrap <details> inner content in .rat for styling
        const processed = content.replace(
            /(<details[^>]*>)([\s\S]*?)(<\/details>)/g,
            (_, open, body, close) => open + '<div class="rat">' + body + '</div>' + close
        );
        return '<' + tag + '>' + processed + '</' + tag + '>';
    }
};
