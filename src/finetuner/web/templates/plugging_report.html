<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} — Company Matcher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg-color:#000; --card-bg:#111; --accent-color:#bb86fc; --text-color:#e0e0e0; --text-muted:#888; --border-color:#333; }
        body { background:var(--bg-color); color:var(--text-color); font-family:'Segoe UI',Tahoma,sans-serif; line-height:1.6; margin:0; padding:0; }
        .main-container { max-width:1400px; margin:0 auto; padding:20px; }
        .header { padding:1rem 0 1.5rem; border-bottom:1px solid var(--border-color); margin-bottom:1.25rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem; }
        .header h1 { font-size:1.8rem; font-weight:700; margin:0; color:#fff; }
        .header p { font-size:0.9rem; margin:0.3rem 0 0; color:var(--text-muted); }
        .nav-links a { color:var(--accent-color); font-size:0.85rem; text-decoration:none; margin-left:1rem; }
        .nav-links a:hover { color:#d1a3ff; }
        .report-meta { background:var(--card-bg); border:1px solid var(--border-color); border-radius:8px; padding:0.75rem 1rem; margin-bottom:1.25rem; font-size:0.82rem; color:var(--text-muted); }
        .report-body { background:#0a0a0a; border:1px solid var(--border-color); border-radius:8px; padding:1.5rem 1.75rem; overflow-x:auto; font-size:0.92rem; }
        .report-body table { border-collapse:collapse; width:100%; margin:1rem 0; }
        .report-body th, .report-body td { border:1px solid #333; padding:8px 10px; vertical-align:top; }
        .report-body h1 { font-size:1.5rem; margin-top:1.25rem; color:#fff; }
        .report-body h2 { font-size:1.2rem; margin-top:1.5rem; color:var(--accent-color); }
        .report-body strong { color:#fff; }
        .empty-state { padding:2rem; color:var(--text-muted); }
        code { color:#c4b5fd; background:#1a1a1a; padding:0.1rem 0.35rem; border-radius:4px; }
    </style>
</head>
<body>
<div class="container-fluid">
<div class="main-container">
    <div class="header">
        <div>
            <h1>{{ page_title }}</h1>
            <p>{{ subtitle }}</p>
        </div>
        <div class="nav-links">
            <a href="/plugging-report/sample"><i class="fas fa-flask me-1"></i>Sample report</a>
            <a href="/plugging-report"><i class="fas fa-file-alt me-1"></i>Full report</a>
            <a href="/plugging"><i class="fas fa-table me-1"></i>Plugging table</a>
            <a href="/"><i class="fas fa-search me-1"></i>Company Search</a>
        </div>
    </div>
    {% if report_meta %}<div class="report-meta">{{ report_meta }}</div>{% endif %}
    {% if error_html %}<div class="empty-state">{{ error_html|safe }}</div>
    {% else %}<div class="report-body">{{ body_html }}</div>{% endif %}
</div>
</div>
</body>
</html>
